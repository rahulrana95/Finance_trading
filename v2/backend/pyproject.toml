[project]
name = "steady"
version = "0.1.0"
description = "v2 stock screener and paper-trading assistant: API and static interface server"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "apscheduler>=3.10,<4",
    "asgi-correlation-id>=4.3",
    "fastapi>=0.115",
    "httpx2>=2.16",
    "pydantic-settings>=2.6",
    "tzdata>=2024.1",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steady"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "PL", "RUF",
    "N", "S", "BLE", "A", "DTZ", "T20", "PT", "ERA", "C90", "ANN", "TRY", "PERF",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["steady"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
